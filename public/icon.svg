<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .chi-letter { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 52px; font-weight: 900; fill: white; transform-box: fill-box; transform-origin: center; }
      @keyframes spinC {
        0% { transform: rotate(0deg); }
        14.2857% { transform: rotate(-360deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes spinI {
        0%, 14.2857% { transform: rotate(0deg); opacity: 0; }
        28.5714% { opacity: 1; }
        42.8571% { transform: rotate(360deg); opacity: 1; }
        100% { transform: rotate(360deg); opacity: 0; }
      }
      .spin-c { animation: spinC 7s ease-in-out infinite; }
      .spin-i { animation: spinI 7s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="100" height="100" rx="22" fill="#E11D48"/>
  <text class="chi-letter spin-c" x="30" y="68" text-anchor="middle">Ч</text>
  <text class="chi-letter spin-i" x="70" y="68" text-anchor="middle">И</text>
</svg>
