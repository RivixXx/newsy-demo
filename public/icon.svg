<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .chi-letter { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 52px; font-weight: 900; fill: white; transform-box: fill-box; transform-origin: center; }
      @keyframes spinC {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes spinI {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .spin-c { animation: spinC 2s ease-in-out forwards; }
      .spin-i { opacity: 0; }
      .spin-i.animate { animation: spinI 2s ease-in-out forwards; }
    </style>
  </defs>
  <rect width="100" height="100" rx="22" fill="#E11D48"/>
  <text class="chi-letter spin-c" x="30" y="68" text-anchor="middle">Ч</text>
  <text class="chi-letter spin-i" x="70" y="68" text-anchor="middle">И</text>
  <script>
    //<![CDATA[
    (function() {
      var svg = document.documentElement;
      var i = svg.querySelector('.spin-i');
      var cycle = function() {
        i.classList.remove('animate');
        i.setAttribute('opacity', '0');
        void i.offsetWidth;
        setTimeout(function() {
          i.setAttribute('opacity', '1');
          i.classList.add('animate');
        }, 2500);
        window.setTimeout(cycle, 2500 + 2000);
      };
      cycle();
    })();
    //]]>
  </script>
</svg>
